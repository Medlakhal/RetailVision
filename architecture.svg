<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cd7f32"/>
      <stop offset="100%" stop-color="#8c5a24"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9d3db"/>
      <stop offset="100%" stop-color="#8a97a3"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#c9a400"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="900" height="620" fill="url(#bg)" rx="16"/>

  <text x="450" y="45" text-anchor="middle" fill="#f1f5f9" font-size="24" font-weight="700">RetailVision — Data Architecture</text>
  <text x="450" y="68" text-anchor="middle" fill="#94a3b8" font-size="13">Bronze → Silver → Gold Pipeline</text>

  <!-- Raw Data -->
  <rect x="330" y="95" width="240" height="46" rx="10" fill="#334155" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="123" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="600">Raw E-commerce Data</text>

  <line x1="450" y1="141" x2="450" y2="175" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Bronze -->
  <rect x="360" y="178" width="180" height="60" rx="12" fill="url(#bronze)" filter="url(#shadow)"/>
  <text x="450" y="213" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">BRONZE</text>

  <line x1="450" y1="238" x2="450" y2="272" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="466" y="258" fill="#94a3b8" font-size="12">Cleaning &amp; Standardization</text>

  <!-- Silver -->
  <rect x="360" y="275" width="180" height="60" rx="12" fill="url(#silver)" filter="url(#shadow)"/>
  <text x="450" y="310" text-anchor="middle" fill="#1e293b" font-size="18" font-weight="700">SILVER</text>

  <line x1="450" y1="335" x2="450" y2="369" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="466" y="355" fill="#94a3b8" font-size="12">Data Warehouse / ETL</text>

  <!-- Gold -->
  <rect x="360" y="372" width="180" height="60" rx="12" fill="url(#gold)" filter="url(#shadow)"/>
  <text x="450" y="407" text-anchor="middle" fill="#1e293b" font-size="18" font-weight="700">GOLD</text>

  <!-- Split arrows -->
  <line x1="450" y1="432" x2="450" y2="452" stroke="#94a3b8" stroke-width="2"/>
  <line x1="450" y1="452" x2="270" y2="452" stroke="#94a3b8" stroke-width="2"/>
  <line x1="450" y1="452" x2="630" y2="452" stroke="#94a3b8" stroke-width="2"/>
  <line x1="270" y1="452" x2="270" y2="480" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="630" y1="452" x2="630" y2="480" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Power BI -->
  <rect x="170" y="483" width="200" height="64" rx="12" fill="url(#blue)" filter="url(#shadow)"/>
  <text x="270" y="510" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">Power BI</text>
  <text x="270" y="530" text-anchor="middle" fill="#e0f2fe" font-size="12">Analytics &amp; Dashboards</text>

  <!-- ML -->
  <rect x="530" y="483" width="200" height="64" rx="12" fill="url(#purple)" filter="url(#shadow)"/>
  <text x="630" y="510" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">Machine Learning</text>
  <text x="630" y="530" text-anchor="middle" fill="#ede9fe" font-size="12">Predictive Use Cases</text>

  <!-- Legend -->
  <text x="70" y="590" fill="#64748b" font-size="11">● Raw</text>
  <text x="140" y="590" fill="#cd7f32" font-size="11">● Bronze</text>
  <text x="220" y="590" fill="#c9d3db" font-size="11">● Silver</text>
  <text x="300" y="590" fill="#ffd700" font-size="11">● Gold</text>
  <text x="380" y="590" fill="#38bdf8" font-size="11">● BI</text>
  <text x="440" y="590" fill="#c084fc" font-size="11">● ML</text>
</svg>
